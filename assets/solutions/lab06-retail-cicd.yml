name: Lab 06 - Validate and deploy retail app

on:
  pull_request:
    paths:
      - src/**
      - tests/**
      - eShopLiteFx.sln
      - .github/workflows/lab06-retail-cicd.yml
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - eShopLiteFx.sln
      - .github/workflows/lab06-retail-cicd.yml
  workflow_dispatch:

concurrency:
  group: lab06-retail-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOLUTION: eShopLiteFx.sln
  BUILD_CONTEXT: .
  DOCKERFILE: src/eShopLite.StoreFx/Dockerfile
  IMAGE_REPOSITORY: caldova-retail

jobs:
  validate:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      - name: Test
        run: dotnet test "$SOLUTION" --configuration Release --no-build -- RunConfiguration.TreatNoTestsAsError=true

      - name: Build container
        run: docker build --file "$DOCKERFILE" --tag caldova-retail:validation "$BUILD_CONTEXT"

      - name: Smoke test container
        shell: bash
        run: |
          set -euo pipefail
          container_name="caldova-retail-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach \
            --name "$container_name" \
            --publish 8080:8080 \
            --env 'ConnectionStrings__StoreDbContext=Server=localhost;Initial Catalog=eShop;User ID=test;Password=not-used;Encrypt=True;TrustServerCertificate=True' \
            caldova-retail:validation
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$container_name"
          exit 1
  build-and-push:
    name: Push immutable image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: lab06
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push
        id: image
        shell: bash
        env:
          ACR_NAME: ${{ vars.LAB06_CONTAINER_REGISTRY_NAME }}
        run: |
          set -euo pipefail
          login_server="${ACR_NAME}.azurecr.io"
          tag="sha-${GITHUB_SHA}"
          tagged_image="${login_server}/${IMAGE_REPOSITORY}:${tag}"
          az acr login --name "$ACR_NAME"
          docker build --file "$DOCKERFILE" --tag "$tagged_image" "$BUILD_CONTEXT"
          docker push "$tagged_image"
          digest=$(az acr repository show \
            --name "$ACR_NAME" \
            --image "${IMAGE_REPOSITORY}:${tag}" \
            --query digest \
            --output tsv)
          test -n "$digest"
          echo "reference=${login_server}/${IMAGE_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"
  deploy:
    name: Deploy approved revision
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: lab06-deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify deployment targets
        shell: bash
        env:
          ACR_NAME: ${{ vars.LAB06_CONTAINER_REGISTRY_NAME }}
          APP_NAME: ${{ vars.LAB06_CONTAINER_APP_NAME }}
          APP_RESOURCE_GROUP: ${{ vars.LAB04_SECONDARY_RESOURCE_GROUP }}
          RUNTIME_IDENTITY_RESOURCE_ID: ${{ vars.LAB06_RUNTIME_IDENTITY_RESOURCE_ID }}
          IMAGE_REFERENCE: ${{ needs.build-and-push.outputs.image }}
        run: |
          set -euo pipefail
          if [[ "$IMAGE_REFERENCE" != "${ACR_NAME}.azurecr.io/${IMAGE_REPOSITORY}@sha256:"* ]]; then
            echo "Image reference '$IMAGE_REFERENCE' is not an immutable digest in the expected registry." >&2
            exit 1
          fi
          identity_json=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$APP_RESOURCE_GROUP" \
            --query identity.userAssignedIdentities \
            --output json)
          if ! jq -e --arg id "${RUNTIME_IDENTITY_RESOURCE_ID,,}" \
            'keys | map(ascii_downcase) | index($id) != null' \
            <<< "$identity_json" > /dev/null; then
            echo "Runtime identity '$RUNTIME_IDENTITY_RESOURCE_ID' is not attached to Container App '$APP_NAME'." >&2
            exit 1
          fi
          registry_identity=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$APP_RESOURCE_GROUP" \
            --query "properties.configuration.registries[?server=='${ACR_NAME}.azurecr.io'].identity | [0]" \
            --output tsv)
          if [[ "${registry_identity,,}" != "${RUNTIME_IDENTITY_RESOURCE_ID,,}" ]]; then
            echo "Registry '$ACR_NAME' is not configured to use the expected runtime identity." >&2
            exit 1
          fi
          env_names=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$APP_RESOURCE_GROUP" \
            --query 'properties.template.containers[0].env[].name' \
            --output json)
          for required_name in \
            ASPNETCORE_ENVIRONMENT \
            AZURE_CLIENT_ID \
            ConnectionStrings__StoreDbContext; do
            if ! jq -e --arg name "$required_name" 'index($name) != null' \
              <<< "$env_names" > /dev/null; then
              echo "Container App '$APP_NAME' is missing required environment variable '$required_name'." >&2
              exit 1
            fi
          done
      - name: Deploy image by digest
        id: deploy
        shell: bash
        env:
          ACR_NAME: ${{ vars.LAB06_CONTAINER_REGISTRY_NAME }}
          APP_NAME: ${{ vars.LAB06_CONTAINER_APP_NAME }}
          APP_RESOURCE_GROUP: ${{ vars.LAB04_SECONDARY_RESOURCE_GROUP }}
          IMAGE_REFERENCE: ${{ needs.build-and-push.outputs.image }}
        run: |
          set -euo pipefail
          revision_name=$(az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$APP_RESOURCE_GROUP" \
            --image "$IMAGE_REFERENCE" \
            --revision-suffix "${GITHUB_SHA:0:12}" \
            --query properties.latestRevisionName \
            --output tsv)
          test -n "$revision_name"
          echo "revision=$revision_name" >> "$GITHUB_OUTPUT"
      - name: Wait for revision health
        shell: bash
        env:
          APP_NAME: ${{ vars.LAB06_CONTAINER_APP_NAME }}
          APP_RESOURCE_GROUP: ${{ vars.LAB04_SECONDARY_RESOURCE_GROUP }}
          REVISION_NAME: ${{ steps.deploy.outputs.revision }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            health_state=$(az containerapp revision show \
              --name "$APP_NAME" \
              --resource-group "$APP_RESOURCE_GROUP" \
              --revision "$REVISION_NAME" \
              --query properties.healthState \
              --output tsv)
            if [[ "$health_state" == "Healthy" ]]; then
              exit 0
            fi
            if [[ "$health_state" == "Unhealthy" ]]; then
              echo "Revision $REVISION_NAME became unhealthy." >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for revision $REVISION_NAME." >&2
          exit 1
      - name: Smoke test through Front Door
        shell: bash
        env:
          GLOBAL_RESOURCE_GROUP: ${{ vars.LAB04_GLOBAL_RESOURCE_GROUP }}
          PROFILE_NAME: ${{ format('{0}-{1}-afd', vars.LAB04_PREFIX, vars.LAB04_SUFFIX) }}
        run: |
          set -euo pipefail
          front_door_host=$(az afd endpoint list \
            --resource-group "$GLOBAL_RESOURCE_GROUP" \
            --profile-name "$PROFILE_NAME" \
            --query '[0].hostName' \
            --output tsv)
          test -n "$front_door_host"
          curl --fail --retry 12 --retry-all-errors --retry-delay 10 \
            "https://${front_door_host}/health"